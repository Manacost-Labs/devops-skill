name: enterprise-networking
version: 0.4.0
kind: executor
allowed_tools:
  - Read
  - Grep
  - Glob
  - Write
  - Edit
  - Bash
requires:
  - devops-platform-contracts >= 0.3.0
  - devops-core >= 0.3.0
capabilities:
  - vpn-operations
  - bgp-operations
  - route-management
  - network-segmentation
  - hybrid-connectivity
  - route-acl-diff
  - mtu-path-analysis
  - staged-network-change
risk_domains:
  - network-control-plane
  - connectivity-loss
  - traffic-exposure
  - management-plane
platforms:
  - Debian/Ubuntu Linux
  - WireGuard
  - FRRouting BGP IPv4 unicast
  - iproute2
  - nftables
source_freshness:
  last_verified: '2026-10-30'
  refresh_before_change: true
  official_sources:
    - https://www.wireguard.com/quickstart/
    - https://docs.frrouting.org/en/stable-8.4/bgp.html
    - https://docs.frrouting.org/en/stable-8.4/basic.html
    - https://manpages.debian.org/bookworm/iproute2/ip-route.8.en.html
    - https://manpages.debian.org/bookworm/iproute2/ip-rule.8.en.html
    - https://wiki.nftables.org/wiki-nftables/index.php/Configuring_chains
    - https://wiki.nftables.org/wiki-nftables/index.php/Atomic_rule_replacement
    - https://docs.kernel.org/networking/ip-sysctl.html
  capability_sources:
    vpn-operations:
      - https://www.wireguard.com/quickstart/
    bgp-operations:
      - https://docs.frrouting.org/en/stable-8.4/bgp.html
    route-management:
      - https://manpages.debian.org/bookworm/iproute2/ip-route.8.en.html
      - https://manpages.debian.org/bookworm/iproute2/ip-rule.8.en.html
    network-segmentation:
      - https://wiki.nftables.org/wiki-nftables/index.php/Configuring_chains
    hybrid-connectivity:
      - https://www.wireguard.com/quickstart/
      - https://docs.frrouting.org/en/stable-8.4/bgp.html
    route-acl-diff:
      - https://manpages.debian.org/bookworm/iproute2/ip-route.8.en.html
      - https://wiki.nftables.org/wiki-nftables/index.php/Configuring_chains
    mtu-path-analysis:
      - https://docs.kernel.org/networking/ip-sysctl.html
      - https://manpages.debian.org/bookworm/iproute2/ip-route.8.en.html
    staged-network-change:
      - https://docs.frrouting.org/en/stable-8.4/bgp.html
      - https://docs.frrouting.org/en/stable-8.4/basic.html
      - https://wiki.nftables.org/wiki-nftables/index.php/Configuring_chains
      - https://wiki.nftables.org/wiki-nftables/index.php/Atomic_rule_replacement
