name: kubernetes-operations
version: 0.3.0
kind: executor
requires:
  - devops-platform-contracts >= 0.3.0
  - devops-core >= 0.3.0
capabilities:
  - kubernetes-cluster-workload-audit
  - kubernetes-server-side-apply
  - kubernetes-controlled-rollout
  - kubernetes-rbac-pss-review
  - kubernetes-network-policy-operations
  - kubernetes-storage-recovery-handoff
risk_domains:
  - cluster-context-and-scope
  - workload-rollout
  - cluster-rbac
  - admission-and-pod-security
  - network-policy
  - persistent-storage
  - control-plane-recovery
platforms:
  - kubernetes
source_freshness:
  last_verified: '2026-08-17'
  refresh_before_change: true
  official_sources:
    - https://kubernetes.io/docs/home/
    - https://kubernetes.io/docs/concepts/security/
    - https://kubernetes.io/docs/reference/using-api/server-side-apply/
    - https://kubernetes.io/docs/concepts/workloads/controllers/deployment/
    - https://kubernetes.io/docs/reference/access-authn-authz/rbac/
    - https://kubernetes.io/docs/concepts/security/pod-security-standards/
    - https://kubernetes.io/docs/concepts/services-networking/network-policies/
    - https://kubernetes.io/docs/concepts/storage/persistent-volumes/
  capability_sources:
    kubernetes-cluster-workload-audit:
      - https://kubernetes.io/docs/home/
    kubernetes-server-side-apply:
      - https://kubernetes.io/docs/reference/using-api/server-side-apply/
    kubernetes-controlled-rollout:
      - https://kubernetes.io/docs/concepts/workloads/controllers/deployment/
    kubernetes-rbac-pss-review:
      - https://kubernetes.io/docs/reference/access-authn-authz/rbac/
      - https://kubernetes.io/docs/concepts/security/pod-security-standards/
    kubernetes-network-policy-operations:
      - https://kubernetes.io/docs/concepts/services-networking/network-policies/
    kubernetes-storage-recovery-handoff:
      - https://kubernetes.io/docs/concepts/storage/persistent-volumes/
