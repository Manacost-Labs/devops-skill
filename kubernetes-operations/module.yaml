name: kubernetes-operations
version: 0.4.0
kind: executor
allowed_tools:
- Read
- Grep
- Glob
- Write
- Edit
- Bash
requires:
- devops-platform-contracts >= 0.4.3
- devops-core >= 0.4.3
capabilities:
- kubernetes-cluster-workload-audit
- kubernetes-server-side-apply
- kubernetes-controlled-rollout
- kubernetes-rbac-pss-review
- kubernetes-network-policy-operations
- kubernetes-storage-recovery-handoff
- kubernetes-crash-resource-diagnosis
- kubernetes-network-path-diagnosis
- kubernetes-storage-diagnosis
- kubernetes-data-aware-release-recovery
risk_domains:
- cluster-context-and-scope
- workload-rollout
- cluster-rbac
- admission-and-pod-security
- network-policy
- persistent-storage
- control-plane-recovery
- resource-pressure
- network-path
- data-format-compatibility
- post-release-writes
platforms:
- kubernetes
source_freshness:
  last_verified: '2026-10-29'
  refresh_before_change: true
  official_sources:
  - https://kubernetes.io/docs/home/
  - https://kubernetes.io/docs/tasks/debug/debug-application/debug-running-pod/
  - https://kubernetes.io/docs/reference/using-api/server-side-apply/
  - https://kubernetes.io/docs/concepts/workloads/controllers/deployment/
  - https://kubernetes.io/docs/reference/access-authn-authz/rbac/
  - https://kubernetes.io/docs/concepts/security/pod-security-standards/
  - https://kubernetes.io/docs/concepts/services-networking/network-policies/
  - https://kubernetes.io/docs/concepts/storage/persistent-volumes/
  - https://kubernetes.io/docs/concepts/workloads/pods/pod-lifecycle/
  - https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
  - https://kubernetes.io/docs/concepts/scheduling-eviction/node-pressure-eviction/
  - https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/
  - https://kubernetes.io/docs/reference/kubectl/generated/kubectl_logs/
  - https://kubernetes.io/docs/tasks/debug/debug-application/debug-service/
  - https://kubernetes.io/docs/tasks/administer-cluster/dns-debugging-resolution/
  - https://kubernetes.io/docs/concepts/services-networking/endpoint-slices/
  - https://kubernetes.io/docs/concepts/storage/storage-classes/
  - https://kubernetes.io/docs/concepts/storage/volume-snapshots/
  - https://kubernetes.io/docs/concepts/workloads/controllers/statefulset/
  - https://kubernetes.io/docs/concepts/workloads/controllers/job/
  - https://kubernetes.io/docs/concepts/workloads/pods/disruptions/
