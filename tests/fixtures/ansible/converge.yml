---
# Synthetic file service only. Not a production deployment template.
- name: Converge isolated synthetic hosts
  hosts: app
  gather_facts: false
  serial: 1
  order: sorted
  any_errors_fatal: true
  tasks:
    - name: Validate and install candidate
      ansible.builtin.copy:
        content: "release={{ release }}\n"
        dest: "{{ host_root }}/config"
        mode: '0600'
        validate: "{{ ansible_playbook_python }} {{ lab_root }}/validate.py %s"
      notify: Activate synthetic service
    - name: Install deterministic secondary setting
      ansible.builtin.copy:
        content: "workers=2\n"
        dest: "{{ host_root }}/settings"
        mode: '0600'
      notify: Activate synthetic service
    - name: Activate before probing the running state
      ansible.builtin.meta: flush_handlers
    - name: Read active synthetic service
      ansible.builtin.slurp:
        src: "{{ host_root }}/active"
      register: running
    - name: Accept the active release
      ansible.builtin.assert:
        that: running.content | b64decode == 'release=' ~ release ~ '\n'
      when: not ansible_check_mode
  handlers:
    - name: Activate synthetic service
      ansible.builtin.command:
        argv:
          - "{{ ansible_playbook_python }}"
          - "{{ lab_root }}/activate.py"
          - "{{ host_root }}"
