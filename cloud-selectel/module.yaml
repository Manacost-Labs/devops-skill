name: cloud-selectel
version: 0.4.0
kind: executor
allowed_tools:
  - Read
  - Grep
  - Glob
  - Bash(openstack:*)
requires:
  - devops-platform-contracts >= 0.7.0
  - devops-core >= 0.7.0
capabilities:
  - selectel-project-discovery
  - selectel-iam-control-plane
  - selectel-network-control-plane
  - selectel-compute-control-plane
  - selectel-managed-service-routing
risk_domains:
  - selectel-project-boundary
  - iam-policy-change
  - network-exposure
  - compute-replacement
  - managed-service-state
  - billing-impact
platforms:
  - selectel-cloud
provides:
  - selectel-cloud-control-plane-v1
  - contract-v2-executor
source_freshness:
  last_verified: '2026-10-30'
  refresh_before_change: true
  official_sources:
    - https://docs.selectel.ru/en/terraform/
    - https://docs.selectel.ru/en/managed-kubernetes/
    - https://docs.selectel.ru/en/api/authorization/
    - https://docs.selectel.ru/en/access-control/
    - https://docs.selectel.ru/en/cloud-servers/
    - https://docs.selectel.ru/en/managed-databases/
    - https://docs.selectel.ru/en/api/users-and-roles/
    - https://docs.selectel.ru/en/api/quota-management/
    - https://docs.selectel.ru/en/api/urls/
    - https://docs.selectel.ru/en/api/cloud-projects-and-resources/
    - https://docs.selectel.ru/en/access-control/permissions/
    - https://docs.selectel.ru/en/access-control/role-reference/
    - https://docs.selectel.ru/en/access-control/projects/quotas/
    - https://docs.selectel.ru/en/cloud-servers/tools/openstack-cli/about-openstack-cli/
    - https://docs.selectel.ru/en/cloud-servers/tools/openstack-cli/configure-openstack-cli/
    - https://docs.selectel.ru/en/cloud-servers/create/create-server/
    - https://docs.selectel.ru/en/cloud-servers/security-groups/about/about-security-groups/
    - https://docs.selectel.ru/en/cloud-servers/security-groups/manage-rules/create-rule/
    - https://docs.selectel.ru/en/cloud-servers/security-groups/manage-rules/delete-rule/
    - https://docs.selectel.ru/en/cloud-servers/security-groups/manage-groups/assign-security-groups/
    - https://docs.selectel.ru/en/cloud-servers/cloud-networks/about-networks/
    - https://docs.selectel.ru/en/cloud-servers/volumes/about-network-volumes/
  capability_sources:
    selectel-project-discovery:
      - https://docs.selectel.ru/en/api/authorization/
      - https://docs.selectel.ru/en/api/cloud-projects-and-resources/
      - https://docs.selectel.ru/en/api/quota-management/
      - https://docs.selectel.ru/en/api/urls/
    selectel-iam-control-plane:
      - https://docs.selectel.ru/en/access-control/
      - https://docs.selectel.ru/en/api/users-and-roles/
      - https://docs.selectel.ru/en/access-control/permissions/
      - https://docs.selectel.ru/en/access-control/role-reference/
    selectel-network-control-plane:
      - https://docs.selectel.ru/en/cloud-servers/
      - https://docs.selectel.ru/en/cloud-servers/security-groups/about/about-security-groups/
      - https://docs.selectel.ru/en/cloud-servers/security-groups/manage-rules/create-rule/
      - https://docs.selectel.ru/en/cloud-servers/security-groups/manage-rules/delete-rule/
      - https://docs.selectel.ru/en/cloud-servers/security-groups/manage-groups/assign-security-groups/
      - https://docs.selectel.ru/en/cloud-servers/cloud-networks/about-networks/
      - https://docs.selectel.ru/en/cloud-servers/tools/openstack-cli/about-openstack-cli/
    selectel-compute-control-plane:
      - https://docs.selectel.ru/en/cloud-servers/
      - https://docs.selectel.ru/en/terraform/
      - https://docs.selectel.ru/en/cloud-servers/tools/openstack-cli/about-openstack-cli/
      - https://docs.selectel.ru/en/cloud-servers/tools/openstack-cli/configure-openstack-cli/
      - https://docs.selectel.ru/en/cloud-servers/create/create-server/
      - https://docs.selectel.ru/en/cloud-servers/volumes/about-network-volumes/
      - https://docs.selectel.ru/en/access-control/projects/quotas/
    selectel-managed-service-routing:
      - https://docs.selectel.ru/en/managed-kubernetes/
      - https://docs.selectel.ru/en/managed-databases/
