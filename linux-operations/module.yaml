name: linux-operations
version: 0.3.0
kind: executor
allowed_tools:
- Read
- Grep
- Glob
- Write
- Edit
- Bash
requires:
- devops-platform-contracts >= 0.2.0
- devops-core >= 0.2.0
capabilities:
- debian-ubuntu-host-audit
- ssh-access-and-hardening
- systemd-service-operations
