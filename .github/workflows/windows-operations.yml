name: windows operations

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: windows-operations-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: Windows Server / native fixtures
    runs-on: windows-2025
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Exercise owned ephemeral Windows resources
        shell: powershell
        run: ./tests/smoke_windows_server.ps1

  protected-endpoint:
    name: Windows / native protected JEA endpoint
    runs-on: windows-2025
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      DEVOPS_OWNED_JEA_FIXTURE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13.5'
      - name: Install pinned PSRP dependencies
        run: python -m pip install --isolated --disable-pip-version-check --no-input --require-hashes -r tools/requirements-windows-bridge.txt
      - name: Exercise actual bounded JEA transport and remote receipts
        shell: powershell
        run: ./tests/smoke_windows_endpoint.ps1 -PythonPath (Get-Command python).Source -SourceRoot (Get-Location).Path
