name: validate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

env:
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONUTF8: '1'

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  platform:
    name: Python 3.13 / ${{ matrix.os }}
    permissions:
      contents: read
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13.5'
          cache: pip

      - name: Install pinned runtime dependency
        run: python -m pip install --isolated --disable-pip-version-check --no-input --require-hashes -r requirements.txt

      - name: Validate platform contracts
        run: python devops-platform-contracts/scripts/validate_platform.py

      - name: Run regression and evaluation-catalog checks
        run: python -m unittest discover -s tests -v

      - name: Build deterministic release
        run: python tools/build_release.py --output dist/devops-skill-platform-0.13.0.zip

      - name: Verify release contents
        run: python tools/verify_release.py dist/devops-skill-platform-0.13.0.zip
