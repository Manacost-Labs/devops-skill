name: validate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

env:
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONUTF8: '1'

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  platform:
    name: Python 3.13 / ${{ matrix.os }}
    permissions:
      contents: read
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13.5'
          cache: pip

      - name: Install pinned runtime dependency
        run: python -m pip install --isolated --disable-pip-version-check --no-input --require-hashes -r requirements.txt

      - name: Validate platform contracts
        run: python devops-platform-contracts/scripts/validate_platform.py

      - name: Run regression and evaluation-catalog checks
        run: python -m unittest discover -s tests -v

      - name: Build deterministic release
        run: python tools/build_release.py --output dist/devops-skill-platform-0.4.0.zip

      - name: Verify release contents
        run: python tools/verify_release.py dist/devops-skill-platform-0.4.0.zip
