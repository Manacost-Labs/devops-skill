name: container operations

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: container-operations-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: Containers / ${{ matrix.component }}
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        component: [docker, kubernetes]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13.5'
      - name: Exercise owned disposable container resources
        env:
          FIXTURE_COMPONENT: ${{ matrix.component }}
        run: |
          if [ "$FIXTURE_COMPONENT" = docker ]; then
            python tests/smoke_containers.py
          else
            python tests/smoke_kubernetes.py
          fi
