name: Vault operations

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: vault-fixture-${{ github.ref }}
  cancel-in-progress: true # Owned disposable fixtures only.

jobs:
  vault:
    name: Vault / grants rotation revocation expiry
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13.5'
      - name: Exercise checksum-pinned Vault on owned loopback state
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONUTF8: '1'
        run: python tests/smoke_vault.py -v
