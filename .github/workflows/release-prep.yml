name: release prep

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-prep-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONUTF8: '1'

jobs:
  verify-rc:
    name: Verify 0.4.0 RC candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out selected immutable revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13.5'
          cache: pip

      - name: Install pinned runtime dependency
        run: python -m pip install --isolated --disable-pip-version-check --no-input --require-hashes -r requirements.txt

      - name: Validate source platform
        run: python devops-platform-contracts/scripts/validate_platform.py

      - name: Run regressions
        run: python -m unittest discover -s tests -v

      - name: Build deterministic candidate
        run: python tools/build_release.py --output dist/devops-skill-platform-0.4.0.zip

      - name: Verify candidate contents
        run: python tools/verify_release.py dist/devops-skill-platform-0.4.0.zip

      - name: Print candidate digest
        run: sha256sum dist/devops-skill-platform-0.4.0.zip

      # Intentionally no upload-artifact, release creation, signing, package
      # publication, environment, OIDC, or secret access. A maintainer must
      # review the run and complete the documented release gates separately.
