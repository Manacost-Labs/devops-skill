name: cicd operations

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: cicd-fixture-${{ github.ref }}
  cancel-in-progress: true # Disposable synthetic jobs only; no production mutation.

env:
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONUTF8: '1'
  FIXTURE_REPOSITORY: ${{ github.repository }}
  FIXTURE_REPOSITORY_ID: ${{ github.repository_id }}
  FIXTURE_RUN_ID: ${{ github.run_id }}
  FIXTURE_ATTEMPT: ${{ github.run_attempt }}
  FIXTURE_SOURCE_SHA: ${{ github.sha }}
  FIXTURE_EVENT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  FIXTURE_HEAD_REPOSITORY_ID: ${{ github.event.pull_request.head.repo.id || github.repository_id }}
  FIXTURE_EVENT: ${{ github.event_name }}

jobs:
  security:
    name: CI/CD / workflow and signed provenance
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: read
      attestations: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13.5'
      - name: Validate real workflows and verify public signed release with negative controls
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tests/smoke_cicd.py

  build:
    name: CI/CD / synthetic artifact producer
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: read
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      archive-digest: ${{ steps.upload.outputs.artifact-digest }}
      payload-digest: ${{ steps.payload.outputs.payload-digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13.5'
      - id: payload
        name: Build only public synthetic fixture bytes
        run: python tests/cicd_artifact.py build "$RUNNER_TEMP/cicd-built"
      - id: upload
        name: Transfer the immutable synthetic artifact to the consumer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cicd-fixture-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cicd-built/payload.json
          archive: true
          if-no-files-found: error
          retention-days: 1

  consume:
    name: CI/CD / artifact admission and partial recovery
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    env:
      FIXTURE_ARTIFACT_ID: ${{ needs.build.outputs.artifact-id }}
      FIXTURE_ARCHIVE_DIGEST: ${{ needs.build.outputs.archive-digest }}
      FIXTURE_PAYLOAD_DIGEST: ${{ needs.build.outputs.payload-digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13.5'
      - name: Check exact service identity and archive bytes before reading payload
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tests/cicd_artifact.py verify "$RUNNER_TEMP/cicd-received"
      - name: Exercise accepted bytes and failure-aware synthetic delivery
        run: python tests/smoke_delivery.py "$RUNNER_TEMP/cicd-received/payload.json" -v
