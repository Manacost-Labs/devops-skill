name: protected execution boundary

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: codex-boundary-${{ github.ref }}
  cancel-in-progress: true

jobs:
  broker:
    name: Broker / native Linux isolation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13.5'
      - name: Run actual TLS client and separate Linux worker and agent identities
        run: python tools/smoke_broker_boundary.py

  host:
    name: Codex / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13.5'
      - name: Install pinned dependencies
        run: python -m pip install --isolated --disable-pip-version-check --no-input --require-hashes -r requirements.txt
      - name: Exercise pinned real Codex with a local synthetic provider
        run: python tests/native_codex_host.py
