name: operations smoke

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: operations-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  edge:
    name: Edge / ${{ matrix.engine }} DNS TLS recovery
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        engine: [nginx, caddy, traefik]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13.5'
      - name: Install hash-pinned synthetic private-PKI and DNS dependencies
        run: >-
          python -m pip install --isolated --disable-pip-version-check --no-input
          --only-binary=:all: --require-hashes -r tests/requirements-edge.txt
      - name: Exercise actual DNS strict TLS proxy failures and recovery
        run: python tests/smoke_edge.py ${{ matrix.engine }} -v

  iac:
    name: IaC / ${{ matrix.tool }} state and recovery
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        tool: [terraform, tofu]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13.5'
      - name: Test pinned CLI against owned synthetic resources and loopback state
        env:
          FIXTURE_IAC_TOOL: ${{ matrix.tool }}
        run: python tests/smoke_terraform.py "$FIXTURE_IAC_TOOL" -v

  ansible:
    name: Ansible / repeatability and partial recovery
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13.5'
      - name: Install hash-pinned native Ansible and dependencies
        run: >-
          python -m pip install --isolated --disable-pip-version-check --no-input
          --only-binary=:all: --require-hashes -r tests/requirements-ansible.txt
      - name: Exercise actual Ansible on disposable synthetic local hosts
        run: python tests/smoke_ansible.py -v

  syntax:
    name: Operations / ${{ matrix.component }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        component: [postgresql, mysql, mariadb, prometheus]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13.5'
      - name: Test pinned disposable engine or real promtool
        run: python tests/smoke_operations.py ${{ matrix.component }}

  recovery:
    name: Recovery / ${{ matrix.scenario }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        scenario: [mysql, mariadb, mariadb-physical]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13.5'
      - name: Rehearse isolated synthetic recovery
        run: python tests/smoke_recovery.py ${{ matrix.scenario }}

  postgres-redis-recovery:
    name: Recovery / ${{ matrix.engine }} native restore
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        engine: [postgres, redis]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13.5'
      - name: Rehearse actual isolated restore and rejected recovery inputs
        env:
          FIXTURE_RECOVERY_ENGINE: ${{ matrix.engine }}
        run: python "tests/smoke_${FIXTURE_RECOVERY_ENGINE}_recovery.py" -v
