name: iac-operations
version: 0.5.0
kind: executor
allowed_tools:
  - Read
  - Grep
  - Glob
  - Write
  - Edit
  - Bash
requires:
  - devops-platform-contracts >= 0.5.0
  - devops-core >= 0.5.0
capabilities:
  - terraform-opentofu-audit
  - terraform-opentofu-plan-apply
  - iac-drift-import-review
  - iac-state-backend-recovery
  - iac-state-lock-diagnosis
  - iac-drift-reconciliation
  - iac-partial-apply-recovery
  - bounded-ansible-execution
  - ansible-inventory-scope-review
  - ansible-repeatability-validation
  - ansible-fleet-rolling-update
  - ansible-partial-failure-recovery
  - cloud-init-validation
risk_domains:
  - infrastructure-state
  - backend-and-locking
  - ambiguous-resource-outcomes
  - state-persistence-loss
  - secrets-in-plans-and-state
  - provider-supply-chain
  - configuration-fanout
  - mixed-fleet-and-partial-execution
  - controller-and-delegated-effects
  - bootstrap-and-replacement
platforms:
  - terraform
  - opentofu
  - ansible
  - cloud-init
source_freshness:
  last_verified: '2026-10-30'
  refresh_before_change: true
  official_sources:
    - https://developer.hashicorp.com/terraform/cli/commands/plan
    - https://developer.hashicorp.com/terraform/cli/import
    - https://developer.hashicorp.com/terraform/language/backend
    - https://developer.hashicorp.com/terraform/language/state/sensitive-data
    - https://opentofu.org/docs/cli/commands/plan/
    - https://developer.hashicorp.com/terraform/language/state/locking
    - https://developer.hashicorp.com/terraform/cli/commands/state/push
    - https://developer.hashicorp.com/terraform/cli/commands/force-unlock
    - https://developer.hashicorp.com/terraform/cli/commands/init
    - https://developer.hashicorp.com/terraform/cli/commands/apply
    - https://developer.hashicorp.com/terraform/language/state/backends
    - https://developer.hashicorp.com/terraform/language/backend/http
    - https://developer.hashicorp.com/terraform/language/backend/s3
    - https://opentofu.org/docs/language/state/locking/
    - https://opentofu.org/docs/cli/commands/state/push/
    - https://opentofu.org/docs/language/settings/backends/http/
    - https://opentofu.org/docs/language/settings/backends/s3/
    - https://opentofu.org/docs/language/state/encryption/
    - https://docs.ansible.com/ansible/latest/playbook_guide/playbooks_checkmode.html
    - https://docs.ansible.com/projects/ansible/latest/inventory_guide/intro_patterns.html
    - https://docs.ansible.com/projects/ansible/latest/reference_appendices/general_precedence.html
    - https://docs.ansible.com/projects/ansible/latest/playbook_guide/playbooks_strategies.html
    - https://docs.ansible.com/projects/ansible/latest/playbook_guide/playbooks_delegation.html
    - https://docs.ansible.com/projects/ansible/latest/playbook_guide/playbooks_error_handling.html
    - https://docs.ansible.com/projects/ansible/latest/playbook_guide/playbooks_blocks.html
    - https://cloudinit.readthedocs.io/en/latest/howto/debugging.html
  capability_sources:
    terraform-opentofu-audit:
      - https://developer.hashicorp.com/terraform/cli/commands/plan
      - https://opentofu.org/docs/cli/commands/plan/
    terraform-opentofu-plan-apply:
