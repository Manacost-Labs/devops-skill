name: docker-operations
version: 0.3.0
kind: executor
allowed_tools:
- Read
- Grep
- Glob
- Write
- Edit
- Bash
requires:
- devops-platform-contracts >= 0.4.3
- devops-core >= 0.4.3
capabilities:
- docker-inventory
- compose-preflight
- image-provenance-check
- compose-rollout
- container-rollback
- docker-crash-resource-diagnosis
- docker-network-path-diagnosis
- docker-storage-diagnosis
- docker-data-aware-release-recovery
risk_domains:
- persistent-volumes
- production-recreate
- registry-credentials
- host-exposure
- resource-pressure
- network-path
- data-format-compatibility
- post-release-writes
platforms:
- docker-engine
- docker-compose
source_freshness:
  last_verified: '2026-10-29'
  refresh_before_change: true
  official_sources:
  - https://docs.docker.com/reference/cli/docker/container/inspect/
  - https://docs.docker.com/reference/cli/docker/compose/config/
  - https://docs.docker.com/reference/compose-file/services/
  - https://docs.docker.com/engine/containers/run/
  - https://docs.docker.com/reference/cli/docker/compose/up/
  - https://docs.docker.com/compose/how-tos/startup-order/
  - https://docs.docker.com/engine/storage/volumes/
  - https://docs.docker.com/engine/containers/resource_constraints/
  - https://docs.docker.com/engine/containers/start-containers-automatically/
  - https://docs.docker.com/reference/cli/docker/container/stats/
  - https://docs.kernel.org/admin-guide/cgroup-v2.html
  - https://docs.docker.com/reference/cli/docker/container/logs/
  - https://docs.docker.com/engine/network/
  - https://docs.docker.com/engine/network/drivers/bridge/
  - https://docs.docker.com/engine/storage/bind-mounts/
  - https://docs.docker.com/engine/storage/tmpfs/
  - https://docs.docker.com/reference/cli/docker/compose/down/
  capability_sources:
    docker-inventory:
    - https://docs.docker.com/reference/cli/docker/container/inspect/
    compose-preflight:
    - https://docs.docker.com/reference/cli/docker/compose/config/
    - https://docs.docker.com/reference/compose-file/services/
    image-provenance-check:
    - https://docs.docker.com/engine/containers/run/
    compose-rollout:
    - https://docs.docker.com/reference/cli/docker/compose/up/
    - https://docs.docker.com/compose/how-tos/startup-order/
    container-rollback:
    - https://docs.docker.com/reference/cli/docker/compose/up/
    - https://docs.docker.com/engine/storage/volumes/
    docker-crash-resource-diagnosis:
    - https://docs.docker.com/engine/containers/resource_constraints/
    - https://docs.docker.com/engine/containers/start-containers-automatically/
    - https://docs.docker.com/reference/cli/docker/container/stats/
    - https://docs.kernel.org/admin-guide/cgroup-v2.html
    - https://docs.docker.com/reference/cli/docker/container/logs/
    docker-network-path-diagnosis:
    - https://docs.docker.com/engine/network/
    - https://docs.docker.com/engine/network/drivers/bridge/
    docker-storage-diagnosis:
    - https://docs.docker.com/engine/storage/volumes/
    - https://docs.docker.com/engine/storage/bind-mounts/
    - https://docs.docker.com/engine/storage/tmpfs/
    - https://docs.docker.com/reference/cli/docker/compose/down/
    docker-data-aware-release-recovery:
    - https://docs.docker.com/reference/cli/docker/compose/up/
    - https://docs.docker.com/engine/storage/volumes/
