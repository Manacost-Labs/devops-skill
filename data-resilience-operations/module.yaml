name: data-resilience-operations
version: 0.3.0
kind: executor
allowed_tools:
  - Read
  - Grep
  - Glob
  - Write
  - Edit
  - Bash
requires:
  - devops-platform-contracts >= 0.3.0
  - devops-core >= 0.3.0
capabilities:
  - postgresql-operations
  - redis-operations
  - backup-inventory
  - isolated-restore-testing
  - recovery-objective-validation
  - point-in-time-recovery
  - data-migration
  - data-failover
  - retention-enforcement
  - data-masking
risk_domains:
  - production-state
  - destructive-change
  - data-confidentiality
  - service-availability
platforms:
  - PostgreSQL
  - Redis
source_freshness:
  last_verified: '2026-08-17'
  refresh_before_change: true
  official_sources:
    - https://www.postgresql.org/docs/current/maintenance.html
    - https://www.postgresql.org/docs/current/backup-dump.html
    - https://www.postgresql.org/docs/current/continuous-archiving.html
    - https://www.postgresql.org/docs/current/warm-standby.html
    - https://www.postgresql.org/docs/current/logical-replication.html
    - https://redis.io/docs/latest/operate/oss_and_stack/management/persistence/
    - https://redis.io/docs/latest/operate/oss_and_stack/management/replication/
    - https://redis.io/docs/latest/operate/oss_and_stack/management/scaling/
    - https://csrc.nist.gov/pubs/sp/800/188/final
  capability_sources:
    postgresql-operations:
      - https://www.postgresql.org/docs/current/maintenance.html
    redis-operations:
      - https://redis.io/docs/latest/operate/oss_and_stack/management/persistence/
      - https://redis.io/docs/latest/operate/oss_and_stack/management/scaling/
    backup-inventory:
      - https://www.postgresql.org/docs/current/backup-dump.html
      - https://redis.io/docs/latest/operate/oss_and_stack/management/persistence/
    isolated-restore-testing:
      - https://www.postgresql.org/docs/current/backup-dump.html
      - https://redis.io/docs/latest/operate/oss_and_stack/management/persistence/
    recovery-objective-validation:
      - https://www.postgresql.org/docs/current/continuous-archiving.html
      - https://redis.io/docs/latest/operate/oss_and_stack/management/replication/
    point-in-time-recovery:
      - https://www.postgresql.org/docs/current/continuous-archiving.html
    data-migration:
      - https://www.postgresql.org/docs/current/logical-replication.html
    data-failover:
      - https://www.postgresql.org/docs/current/warm-standby.html
      - https://redis.io/docs/latest/operate/oss_and_stack/management/replication/
    retention-enforcement:
      - https://www.postgresql.org/docs/current/continuous-archiving.html
      - https://redis.io/docs/latest/operate/oss_and_stack/management/persistence/
    data-masking:
      - https://csrc.nist.gov/pubs/sp/800/188/final
