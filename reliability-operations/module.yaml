name: reliability-operations
version: 0.3.0
kind: executor
allowed_tools:
- Read
- Grep
- Glob
- Write
- Edit
- Bash
requires:
- devops-platform-contracts >= 0.2.0
- devops-core >= 0.2.0
capabilities:
