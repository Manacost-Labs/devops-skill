# Synthetic example only. Both code=200 and code=500 counters are initialized.
# Eligible events and fixed service inventory must be replaced for real workloads.
groups:
  - name: demo-http
    interval: 1m
    rules:
      - record: demo:http_error_ratio:rate5m
        expr: sum by (service) (rate(demo_http_requests_total{code="500"}[5m])) / sum by (service) (rate(demo_http_requests_total[5m]))
      - alert: DemoHighErrorRatio
        expr: demo:http_error_ratio:rate5m > 0.05
        for: 2m
        labels:
          severity: test
        annotations:
          summary: Synthetic demo error ratio exceeds 5 percent
      - alert: DemoTelemetryMissing
        expr: absent(demo_http_requests_total{service="demo",code="200"}) or absent(demo_http_requests_total{service="demo",code="500"})
        for: 1m
        labels:
          severity: test
        annotations:
          summary: Synthetic demo counter is missing
