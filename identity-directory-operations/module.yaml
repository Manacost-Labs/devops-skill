name: identity-directory-operations
version: 0.3.0
kind: executor
allowed_tools:
  - Read
  - Grep
  - Glob
  - Write
  - Edit
  - Bash
requires:
  - devops-platform-contracts >= 0.3.0
  - devops-core >= 0.3.0
capabilities:
  - active-directory-readonly-discovery
  - active-directory-ou-and-object-provisioning
  - active-directory-principal-and-group-provisioning
  - active-directory-group-membership-governance
  - active-directory-delegated-administration
  - group-policy-inventory-and-reporting
  - group-policy-staged-change-management
  - group-policy-backup-restore-planning
risk_domains:
