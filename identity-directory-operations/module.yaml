  - privileged-group-membership
  - directory-delegation
  - group-policy-inheritance-and-enforcement
  - domain-controller-and-sysvol
platforms:
  - Active Directory Domain Services
  - Group Policy Management
  - Windows Server 2019
  - Windows Server 2022
  - Windows Server 2025
